[project]
name = "trade-bot-worker"
version = "1.0.0"
description = "CEX/DEX Spread Monitoring Background Worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery==5.3.4",
    "redis==5.0.1",
    "clickhouse-connect==0.6.23",
    "ccxt==4.1.68",
    "web3==6.11.3",
    "pydantic==2.5.0",
    "python-dotenv==1.0.0",
    "hyperliquid-python-sdk>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
